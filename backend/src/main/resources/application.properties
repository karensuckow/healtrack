spring.application.name=healtrack

spring.datasource.url=jdbc:postgresql://localhost:5432/healtrack
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

api.security.token.secret=${JWT_SECRET:fake_pass_for_git_project}
api.security.token.expiration=${JWT_EXPIRATION:3600}
api.security.token.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400}
